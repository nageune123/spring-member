name: Spring Boot CI

on:
  push:
    branches: [ "main" ]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/nageune123/spring-member:${{ github.sha }} -t ghcr.io/nageune123/spring-member:latest .

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/nageune123/spring-member:${{ github.sha }}
          docker push ghcr.io/nageune123/spring-member:latest
  deploy:
    needs: build
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/spring-member-deployment spring-member=ghcr.io/nageune123/spring-member:${{ github.sha }}
          kubectl rollout status deployment/spring-member-deployment --timeout=180s
